[package]
name = "silkai-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
llama = ["silkai-adapters/llama"]
cuda = ["llama", "silkai-adapters/cuda"]
vulkan = ["llama", "silkai-adapters/vulkan"]
metal = ["llama", "silkai-adapters/metal"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silkai-adapters = { path = "../silkai-adapters" }
silkai-sched = { path = "../silkai-sched" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
