[package]
name = "silkai-server"
description = "HTTP and WebSocket daemon for SilkAI: OpenAI-style chat on top of the GPU scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
llama = ["silkai-adapters/llama"]
cuda = ["llama", "silkai-adapters/cuda"]
vulkan = ["llama", "silkai-adapters/vulkan"]
metal = ["llama", "silkai-adapters/metal"]
# Router builders on a fixed fake machine for tests. Not a supported API.
test-util = ["silkai-sched/test-util"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silkai-adapters.workspace = true
silkai-sched.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tower = "0.5"
tracing = "0.1"

[dev-dependencies]
silkai-server = { path = ".", features = ["test-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
