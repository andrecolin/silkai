[package]
name = "silkai-sched"
description = "GPU packing scheduler for SilkAI: decides which local models sit on the card, wait, or stay warm in RAM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Shared fixtures (the "clinic" machine) used by this crate's tests and by
# silkai-server's test helpers. Not part of the supported API.
test-util = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
silkai-sched = { path = ".", features = ["test-util"] }
