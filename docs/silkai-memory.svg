<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">SilkAI memory: three models warm in RAM, one on the GPU</title>
  <desc id="desc">128 GB RAM holds transcribe, write, and index all day. A 32 GB GPU holds only the model that is working, plus a small slice for the machine.</desc>
  <rect width="720" height="420" fill="#0f1419"/>
  <text x="36" y="40" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.08em">SYSTEM RAM · 128 GB</text>
  <text x="36" y="62" fill="#e8eef4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">All three models stay warm all day</text>
  <g>
    <rect x="36" y="80" width="200" height="88" rx="10" fill="#1a2330" stroke="#3d4f66"/>
    <text x="136" y="118" text-anchor="middle" fill="#9ecbff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">transcribe</text>
    <text x="136" y="140" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">12 GB · live</text>
    <rect x="260" y="80" width="200" height="88" rx="10" fill="#1a2330" stroke="#3d4f66"/>
    <text x="360" y="118" text-anchor="middle" fill="#9ecbff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">write</text>
    <text x="360" y="140" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">28 GB · exclusive</text>
    <rect x="484" y="80" width="200" height="88" rx="10" fill="#1a2330" stroke="#3d4f66"/>
    <text x="584" y="118" text-anchor="middle" fill="#9ecbff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">index</text>
    <text x="584" y="140" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">10 GB · background</text>
  </g>
  <text x="360" y="210" text-anchor="middle" fill="#7d8c9c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">copy in about 1–3 seconds  ↕</text>
  <text x="36" y="250" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.08em">GPU · 32 GB</text>
  <text x="36" y="272" fill="#e8eef4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Only whoever is working right now</text>
  <rect x="36" y="292" width="516" height="88" rx="10" fill="#14304a" stroke="#4da3ff"/>
  <text x="294" y="330" text-anchor="middle" fill="#e8eef4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">write · on the bench</text>
  <text x="294" y="354" text-anchor="middle" fill="#9ecbff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">28 GB · summaries, long answers</text>
  <rect x="564" y="292" width="120" height="88" rx="10" fill="#1a2330" stroke="#5a6b7d"/>
  <text x="624" y="330" text-anchor="middle" fill="#c5d0dc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">desktop</text>
  <text x="624" y="354" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">~3 GB left</text>
</svg>
