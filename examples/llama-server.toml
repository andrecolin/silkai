# A clinic on one card: a speech engine held live while the doctor dictates,
# and a note writer that needs the whole card.
#
# SilkAI starts and stops both as child processes. The writer runs under
# llama-server (build llama.cpp once, https://github.com/ggml-org/llama.cpp);
# the speech engine is whatever ASR server you run, since llama-server does
# not serve Whisper models. Either way SilkAI only spawns the command, waits
# for GET /health, and decides who is on the card. No `--features` needed on
# SilkAI itself. Copy to ~/.config/silkai/config.toml and edit the paths.
#
# On a 32 GB card the two do not fit together: 10 + 26 is over the 28 GB left
# after headroom, so asking for a note parks the speech engine, and the next
# dictation brings it back and parks the writer.

listen = "127.0.0.1:8080"

# Optional status page at /ui. Off by default; /v1/status, /v1/events and
# /metrics are always on. A token guards /ui, /metrics and /admin/*.
# [ui]
# enabled = true
# token = "change-me"

[resources]
# gpu_total_gb and ram_total_gb are probed (nvidia-smi, /proc/meminfo).
gpu_headroom_gb = 4
ram_headroom_gb = 32
prefetch_on_start = true
request_timeout_secs = 600

# Live: held on the card while the microphone is open, and shareable.
# Your ASR server must answer GET /health once it is ready to transcribe.
# Audio goes to port 8101 directly; SilkAI only decides where it lives.
[models.whisper]
engine = "process"
path = "whisper"                          # the name clients send
url = "http://127.0.0.1:8101"             # must match the port below
cmd = ["env", "WHISPER_MODEL=large-v3",
       "your-asr-server", "--host", "127.0.0.1", "--port", "8101"]
vram_gb = 10
priority = "live"
slots = 2                                  # matches --parallel
transport = "both"
idle_timeout_secs = 60

# SOAP-note writer: needs the card to itself.
[models.soap]
engine = "process"
path = "soap"
url = "http://127.0.0.1:8102"
cmd = ["llama-server",
       "--model", "/models/Qwen3-27B-Q5_K_XL.gguf",
       "--alias", "soap", "--host", "127.0.0.1", "--port", "8102",
       "--ctx-size", "16384", "--n-gpu-layers", "999",
       "--jinja", "--reasoning-budget", "0", "--no-webui"]
vram_gb = 26
priority = "normal"
exclusive = true
