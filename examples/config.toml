# Copy to ~/.config/silkai/config.toml, or set SILKAI_CONFIG.
# Slice 1 uses engine = "fake" so the daemon runs without a GPU.

listen = "127.0.0.1:8080"

[resources]
gpu_total_gb = 32
gpu_headroom_gb = 3
ram_total_gb = 128
ram_headroom_gb = 32
prefetch_on_start = true
request_timeout_secs = 600
# Two cards: each is its own bench; RAM is still one shelf.
# [[resources.gpus]]
# id = 0
# total_gb = 32
# headroom_gb = 3
# [[resources.gpus]]
# id = 1
# total_gb = 32
# headroom_gb = 3

# Live speech-to-text: two people can share this copy.
[models.transcribe]
engine = "fake"
# engine = "llama.cpp"
path = "/models/transcribe.bin"
vram_gb = 12
priority = "live"
exclusive = false
slots = 2
keep_warm = true
transport = "both"
# transport = "websocket"  # session socket only
# transport = "http"       # POST /v1/chat/completions only

# Large writer: needs the GPU to itself (summaries, emails, long answers).
[models.write]
engine = "fake"
# engine = "llama.cpp"
# engine = "vllm"
path = "/models/write-q4.gguf"
# path = "Qwen/Qwen3-0.6B"          # vLLM model id
# url = "http://127.0.0.1:8000"     # vLLM base URL (default)
vram_gb = 28
priority = "normal"
exclusive = true
slots = 1
keep_warm = true
transport = "http"

# Small indexer / tagger: runs in leftover space only.
[models.index]
engine = "fake"
# engine = "llama.cpp"
path = "/models/index-q4.gguf"
vram_gb = 10
priority = "background"
exclusive = false
slots = 1
keep_warm = true
transport = "http"
