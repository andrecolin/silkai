# Copy to ~/.config/silkai/config.toml, or set SILKAI_CONFIG.
# Slice 1 uses engine = "fake" so the daemon runs without a GPU.

listen = "127.0.0.1:8080"

# Optional status page at /ui. Off by default; /v1/status, /v1/events and
# /metrics are always on. A token guards /ui, /metrics and /admin/*.
# [ui]
# enabled = true
# token = "change-me"

[resources]
gpu_total_gb = 32
# Omit gpu_total_gb and [[resources.gpus]] to probe NVIDIA cards via nvidia-smi.
gpu_headroom_gb = 3
ram_total_gb = 128
# Omit ram_total_gb to probe MemTotal (/proc/meminfo) or sysctl hw.memsize.
ram_headroom_gb = 32
prefetch_on_start = true
request_timeout_secs = 600
# Two cards: each is its own bench; RAM is still one shelf.
# [[resources.gpus]]
# id = 0
# total_gb = 32
# headroom_gb = 3
# [[resources.gpus]]
# id = 1
# total_gb = 32
# headroom_gb = 3
# One model on both cards (layer/tensor split): gpus = [0, 1]

# Live speech-to-text (whisper): two people can share this copy.
# A large medical ASR model: bigger than the tiny ones, and worth it for
# clinical vocabulary. It stays live so dictation is never interrupted.
[models.whisper]
engine = "fake"
# engine = "llama.cpp"
path = "/models/whisper-large-medical.bin"
vram_gb = 10
priority = "live"
exclusive = false
slots = 2
keep_warm = true
transport = "both"
# transport = "websocket"  # session socket only
# transport = "http"       # POST /v1/chat/completions only

# SOAP-note writer: needs the GPU to itself.
[models.soap]
engine = "fake"
# engine = "llama.cpp"
# engine = "vllm"
# engine = "ollama"
# engine = "process"
# cmd = ["vllm", "serve", "Qwen/Qwen3-0.6B", "--port", "8001"]
# url = "http://127.0.0.1:8001"     # process: must match --port
path = "/models/soap-q4.gguf"
# path = "Qwen/Qwen3-0.6B"          # vLLM model id
# path = "llama3.2"                 # Ollama model name
# url = "http://127.0.0.1:8000"     # vLLM base URL (default)
# url = "http://127.0.0.1:11434"    # Ollama base URL (default)
vram_gb = 26
priority = "normal"
exclusive = true
slots = 1
keep_warm = true
transport = "http"

# Chart reader: runs in leftover space only.
[models.chart]
engine = "fake"
# engine = "llama.cpp"
path = "/models/chart-q4.gguf"
vram_gb = 5
priority = "background"
exclusive = false
slots = 1
keep_warm = true
transport = "http"
