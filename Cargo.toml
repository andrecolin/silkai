[workspace]
resolver = "2"
members = [
    "crates/silkai-sched",
    "crates/silkai-adapters",
    "crates/silkai-server",
    "crates/silkai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/andrecolin/silkai"
homepage = "https://github.com/andrecolin/silkai"
readme = "README.md"
keywords = ["gpu", "llm", "scheduler", "llama-cpp", "inference"]
categories = ["command-line-utilities"]

[workspace.dependencies]
silkai-sched = { path = "crates/silkai-sched", version = "0.1.0" }
silkai-adapters = { path = "crates/silkai-adapters", version = "0.1.0" }
silkai-server = { path = "crates/silkai-server", version = "0.1.0" }
